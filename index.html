<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fuel — Bulk Dashboard</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#ffffff" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Fuel" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* Monochrome palette: white, greys, black */
:root{
  --bg:#f5f5f5; --bg2:#fafafa; --surface:#ffffff; --surface2:#f4f4f5; --raise:#ececee;
  --line:#e7e7e9; --line2:#d9d9dd;
  --text:#0a0a0a; --text2:#3f3f46; --mute:#71717a; --dim:#a1a1aa;
  --kcal:#0a0a0a; --pro:#5c5c63; --carb:#a8a8b0; --cre:#0a0a0a; --warn:#52525b; --ok:#0a0a0a; --bad:#0a0a0a;
  --ease:cubic-bezier(.22,1,.36,1); --ease2:cubic-bezier(.65,0,.35,1);
  --r:12px; --sb:232px;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 1px 1px rgba(0,0,0,.02);
  --shadow2:0 12px 32px -12px rgba(0,0,0,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light}
body{background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;font-feature-settings:"cv11","ss01"}
.num,.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.h{letter-spacing:-.015em}
a{color:var(--text);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line2)} a:hover{text-decoration-color:var(--text)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:8px 11px;outline:none;transition:border-color .2s,box-shadow .2s;min-width:0}
input::placeholder{color:var(--dim)}
input:focus,select:focus{border-color:var(--text);box-shadow:0 0 0 3px rgba(0,0,0,.06)}
svg.i{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:var(--sb) 1fr;min-height:100vh}
aside.sb{position:sticky;top:0;height:100vh;padding:20px 12px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:24px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px}
.mark{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--text)}
.mark svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linejoin:round}
.brand b{font-size:15px;font-weight:600;letter-spacing:-.01em}
.brand small{display:block;font-size:11.5px;color:var(--mute);margin-top:-1px}
.navlbl{font-size:11px;font-weight:500;color:var(--dim);padding:0 12px;margin-bottom:-16px;text-transform:uppercase;letter-spacing:.06em}
nav.nav{display:flex;flex-direction:column;gap:1px;position:relative}
nav.nav button{display:flex;align-items:center;gap:10px;height:36px;padding:0 12px;border-radius:8px;color:var(--mute);font-weight:500;font-size:13.5px;transition:color .2s;position:relative;z-index:1;text-align:left}
nav.nav button:hover{color:var(--text)}
nav.nav button.on{color:var(--text)}
nav.nav .pill{position:absolute;left:0;right:0;height:36px;border-radius:8px;background:var(--surface2);transition:transform .4s var(--ease);z-index:0}
.sb-foot{margin-top:auto;padding:14px;border-radius:10px;background:var(--bg2);border:1px solid var(--line)}
#installBtn:not(.hide)+.sb-foot{margin-top:-14px}
.sb-foot .lbl{font-size:11.5px;color:var(--mute)}
.sb-foot .big{font-size:18px;font-weight:600;margin-top:2px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.mini{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:10px}
.mini i{display:block;height:100%;border-radius:inherit;background:var(--text);transition:width 1s var(--ease)}
main{padding:28px 36px 72px;max-width:1320px;width:100%}
@media (max-width:920px){
  .app{grid-template-columns:1fr}
  aside.sb{position:sticky;height:auto;flex-direction:row;align-items:center;padding:8px 12px;gap:8px;z-index:20;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .brand small,.sb-foot,nav.nav .pill,.navlbl{display:none}
  nav.nav{flex-direction:row}
  nav.nav button span{display:none}
  nav.nav button.on{background:var(--surface2)}
  main{padding:20px 14px 60px}
}

/* ---------- motion ---------- */
.enter{animation:viewIn .45s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}}
.st>*{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0)*40ms)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes fadeIn{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- header ---------- */
.top{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.top .eyebrow{font-size:12.5px;color:var(--mute)}
.top h1{font-size:26px;font-weight:600;letter-spacing:-.025em;line-height:1.2;margin-top:3px}
.sp{flex:1}
.seg{display:flex;align-items:center;padding:3px;border-radius:9px;background:var(--surface2);border:1px solid var(--line)}
.seg button{white-space:nowrap;height:28px;min-width:28px;padding:0 10px;border-radius:6px;color:var(--text2);display:grid;place-items:center;font-weight:500;font-size:12.5px;transition:background .2s,color .2s,box-shadow .2s}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow),0 0 0 1px var(--line)}
.tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:500;color:var(--text2);background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.tag svg.i{width:12px;height:12px}
.tag.campus{background:var(--text);color:#fff;border-color:var(--text)}
.tag.home{background:var(--surface);color:var(--text2)}
.tag.src{background:var(--surface);color:var(--text2)}
.btn{white-space:nowrap;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:8px;font-weight:500;font-size:13px;background:var(--surface);border:1px solid var(--line2);box-shadow:var(--shadow);transition:background .2s,border-color .2s,transform .15s}
.btn:hover{background:var(--bg2);border-color:#c8c8ce}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--text);border-color:var(--text);color:#fff}
.btn.pri:hover{background:#27272a}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:7px}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);transition:border-color .25s,box-shadow .25s}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.ch h3{font-size:14px;font-weight:600;letter-spacing:-.01em}
.ch .sub{font-size:12px;color:var(--mute)}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,1fr)}
.main2{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);margin-top:16px;align-items:start}
.g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:1000px){.main2,.g2,.g3{grid-template-columns:1fr}}
@media (max-width:520px){.kpis{grid-template-columns:1fr}}
.muted{color:var(--mute)} .dim{color:var(--dim)} .small{font-size:12px} .xs{font-size:11.5px}

/* ---------- KPI ---------- */
.kpi .k-top{display:flex;align-items:center;gap:8px;color:var(--text2);font-weight:500;font-size:13px}
.kpi .dot{width:8px;height:8px;border-radius:2px}
.kpi .pct{margin-left:auto;font-size:12px;font-weight:500;color:var(--mute);font-variant-numeric:tabular-nums}
.kpi .val{display:flex;align-items:baseline;gap:6px;margin:12px 0 14px}
.kpi .val b{font-size:30px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi .val span{color:var(--mute);font-size:13px}
.bar{height:6px;border-radius:6px;background:var(--surface2);overflow:hidden;position:relative}
.bar i{display:block;height:100%;width:0;border-radius:inherit;transition:width 1s var(--ease)}
.kpi .rem{margin-top:10px;font-size:12px;color:var(--mute)}
.kpi.hit .rem{color:var(--text);font-weight:500}
.kpi.hit .rem::before{content:"✓ "}

/* creatine */
.cre{display:flex;gap:8px;margin:12px 0}
.cre button{flex:1;height:40px;border-radius:8px;border:1px dashed var(--line2);color:var(--mute);display:flex;align-items:center;justify-content:center;gap:7px;font-size:12.5px;font-weight:500;transition:all .3s var(--ease)}
.cre button:hover{border-color:var(--text);color:var(--text)}
.cre button.on{border:1px solid var(--text);background:var(--text);color:#fff}
.streak{display:grid;grid-template-columns:repeat(14,1fr);gap:3px}
.streak i{height:6px;border-radius:2px;background:var(--surface2);transition:background .4s}
.streak i.full{background:var(--text)} .streak i.part{background:var(--dim)}

/* ---------- meals ---------- */
.mhead{display:flex;align-items:center;gap:12px}
.mcount{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.mcount .bar{width:110px;height:4px}
.mcount .bar i{background:var(--text)}
.next-line{font-size:13px;color:var(--text2);padding:10px 12px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);margin:14px 0 12px;display:flex;align-items:center;gap:8px}
.next-line b{color:var(--text);font-weight:600}
.meals{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.meal{display:grid;grid-template-columns:28px 72px 36px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 14px;background:var(--surface);border-bottom:1px solid var(--line);position:relative;transition:background .3s var(--ease)}
.meal:last-child{border-bottom:0}
.meal:hover{background:var(--bg2)}
.meal::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--text);transform:scaleY(0);transition:transform .4s var(--ease)}
.meal.next::before{transform:scaleY(1)}
.meal .tm{font-size:12.5px;color:var(--text);font-weight:500;font-variant-numeric:tabular-nums}
.meal .tm small{display:block;font-size:11px;color:var(--mute);font-weight:400}
.ic{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;background:var(--surface2);color:var(--text2);transition:all .3s var(--ease)}
.meal .ttl{font-weight:600;font-size:14px;cursor:pointer;text-decoration:line-through;text-decoration-color:transparent;text-decoration-thickness:1.5px;transition:color .3s,text-decoration-color .3s}
.meal .ttl:hover{text-decoration:underline;text-decoration-color:var(--line2)}
.meal .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.meal .mac{font-size:12px;color:var(--mute);margin-top:6px;font-variant-numeric:tabular-nums}
.meal .mac b{font-weight:600;color:var(--text2)!important}
.meal .note{font-size:12px;color:var(--dim);margin-top:2px}
.nextpill{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:var(--text);border-radius:4px;padding:2px 6px;margin-left:8px;vertical-align:2px;display:none}
.meal.next .nextpill{display:inline-block;animation:fadeIn .4s var(--ease)}
.meal.done{background:var(--bg2)}
.meal.done .ttl{color:var(--dim);text-decoration-color:var(--dim)}
.meal.done .ttl:hover{text-decoration:line-through}
.meal.done .ic{background:var(--text);color:#fff}
.meal .mac,.meal .meta,.meal .tm{transition:opacity .3s}
.meal.done .mac,.meal.done .meta,.meal.done .tm{opacity:.45}
.cb{width:22px;height:22px;border-radius:6px;border:1.5px solid #c4c4ca;background:var(--surface);display:grid;place-items:center;transition:background .25s var(--ease),border-color .25s var(--ease),transform .15s}
.cb:hover{border-color:var(--text)}
.cb:active{transform:scale(.85)}
.cb svg{width:14px;height:14px}
.cb path{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .35s var(--ease2) .05s}
.meal.done .cb,.gi.got .cb{background:var(--text);border-color:var(--text)}
.meal.done .cb{animation:pop .35s var(--ease)}
.meal.done .cb path,.gi.got .cb path{stroke-dashoffset:0}
@keyframes pop{40%{transform:scale(1.12)}}
.go{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--dim);transition:all .2s}
.go:hover{color:var(--text);background:var(--surface2)}
@media (max-width:640px){.meal{grid-template-columns:26px minmax(0,1fr) auto}.meal .tm,.meal .ic{display:none}}

/* rings */
.ringwrap{display:flex;flex-direction:column;align-items:stretch;gap:18px}
.ringwrap .ringc{margin:0 auto}
.ringwrap .legend{border-top:1px solid var(--line);padding-top:14px;gap:10px}
.ringwrap svg circle.p{transition:stroke-dashoffset 1.1s var(--ease)}
.ringc{position:relative;width:150px;height:150px;flex:none}
.ringc svg{width:150px;height:150px}
.ringc .center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ringc .center b{font-size:26px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ringc .center small{font-size:11px;color:var(--mute)}
.legend{display:flex;flex-direction:column;gap:12px;flex:1;min-width:0}
.legend div{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2)}
.legend i{width:8px;height:8px;border-radius:2px;flex:none}
.legend b{margin-left:auto;font-weight:600;font-size:12.5px;color:var(--text);white-space:nowrap;font-variant-numeric:tabular-nums}
.legend b em{font-style:normal;color:var(--dim);font-weight:400}
@media (max-width:420px){.ringwrap{flex-direction:column}}

/* day timeline */
.dayline{position:relative;height:40px;margin:8px 0 4px}
.dayline .base{position:absolute;left:0;right:0;top:19px;height:2px;border-radius:2px;background:var(--line)}
.dayline .blk{position:absolute;top:12px;height:16px;border-radius:4px;background:repeating-linear-gradient(-45deg,#e4e4e7 0 4px,#f4f4f5 4px 8px);border:1px solid var(--line2)}
.dayline .d{position:absolute;top:14px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--surface);border:1.5px solid #b4b4bb;transition:all .35s var(--ease)}
.dayline .d.done{background:var(--text);border-color:var(--text)}
.dayline .now{position:absolute;top:4px;bottom:4px;width:1.5px;margin-left:-.75px;background:var(--text)}
.dayline .now::after{content:"Now";position:absolute;top:-13px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:600;color:var(--text)}
.hours{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.cal{display:flex;gap:10px;padding:10px 12px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);font-size:12.5px;color:var(--text2);margin-top:8px;line-height:1.45}
.cal svg.i{color:var(--text);margin-top:1px;width:15px;height:15px}

/* quick add */
.xlist{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.x{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);font-size:13px;animation:rise .3s var(--ease)}
.x .mono{font-size:12px;color:var(--mute)}
.xadd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.xadd #xn,.xadd .btn{grid-column:1/-1}
.xadd .btn{justify-content:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chips .btn{height:28px;font-size:12px;padding:0 10px;box-shadow:none;color:var(--text2)}

/* ---------- plan ---------- */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
@media (max-width:1100px){.week{grid-template-columns:repeat(2,1fr)}}
.day{padding:14px;border-radius:10px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;transition:border-color .25s,transform .25s var(--ease),box-shadow .25s}
.day:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:var(--shadow2)}
.day.today{border-color:var(--text)}
.day h4{font-size:13.5px;font-weight:600;display:flex;justify-content:space-between}
.day .row{display:flex;gap:8px;font-size:12px;padding:6px 0;border-bottom:1px solid var(--line);color:var(--text2)}
.day .row:last-of-type{border:0}
.day .row .mono{color:var(--dim);font-size:11px;min-width:42px}
.day .tot{font-size:11.5px;color:var(--mute);margin-top:8px;font-variant-numeric:tabular-nums}
.list-item{display:grid;grid-template-columns:36px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border:0}
ol.steps{padding-left:20px;color:var(--text2)}
ol.steps li{margin-bottom:10px;line-height:1.6;padding-left:4px}
ol.steps li::marker{color:var(--dim);font-size:12px}
ol.steps b{color:var(--text)}

/* ---------- recipes ---------- */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.rc{cursor:pointer;transition:transform .3s var(--ease),border-color .3s,box-shadow .3s}
.rc:hover{transform:translateY(-2px);border-color:var(--line2);box-shadow:var(--shadow2)}
.rc h4{font-size:15px;font-weight:600;margin:14px 0 8px;line-height:1.35;letter-spacing:-.01em}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:14px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.macros div{padding:9px 11px;background:var(--bg2);border-right:1px solid var(--line)}
.macros div:last-child{border-right:0}
.macros b{display:block;font-size:16px;font-weight:600;color:var(--text)!important;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.macros span{font-size:11px;color:var(--mute)}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:flex;justify-content:center;align-items:flex-start;padding:48px 16px;overflow:auto;background:rgba(10,10,10,.28);backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:opacity .25s var(--ease),visibility 0s .25s}
.modal.on{opacity:1;visibility:visible;transition:opacity .25s var(--ease)}
.modal .card{max-width:740px;width:100%;transform:translateY(12px) scale(.985);transition:transform .4s var(--ease);box-shadow:0 30px 70px -20px rgba(0,0,0,.35)}
.modal.on .card{transform:none}
.ing{display:grid;grid-template-columns:1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.ing .s{font-size:11.5px;color:var(--dim);margin-top:2px}
.callout{padding:11px 13px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);border-left:2px solid var(--text);font-size:13px;color:var(--text2);margin:14px 0}

/* ---------- grocery ---------- */
.budget{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.budget .amt{font-size:32px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.store{margin-top:14px}
.store .ch .sw{width:22px;height:22px;border-radius:6px;background:var(--text);color:#fff;display:grid;place-items:center;font-size:11.5px;font-weight:600}
.sec{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:16px 0 6px}
.gi{display:grid;grid-template-columns:28px minmax(0,1fr) 92px 72px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);transition:opacity .3s}
.gi.got{opacity:.45}
.gi .gn{text-decoration:line-through;text-decoration-color:transparent;transition:text-decoration-color .3s}
.gi.got .gn{text-decoration-color:var(--mute)}
.gi .w{font-size:12px;color:var(--mute);margin-top:2px}
.gi input{padding:5px 8px;font-size:12px;width:100%}
.gi .pr{text-align:right;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
@media (max-width:640px){.gi{grid-template-columns:26px minmax(0,1fr) 64px}.gi .aw{display:none}}

/* ---------- weight ---------- */
.stat .lbl{font-size:12.5px;color:var(--mute)}
.stat b{display:block;font-size:26px;font-weight:600;margin-top:6px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.chart path.draw:not(.dash){stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.5s var(--ease) forwards .15s}
.chart path.draw.dash{animation:fadeIn 1s var(--ease) both .3s}
@keyframes draw{to{stroke-dashoffset:0}}
.chart .band{animation:fadeIn 1s var(--ease) both .3s}
.lg{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:12px}
.lg i{display:inline-block;width:18px;height:0;border-top:2px solid;vertical-align:middle;margin-right:7px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font-size:11.5px;font-weight:500;color:var(--mute);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:10px 6px;border-bottom:1px solid var(--line);color:var(--text2);font-variant-numeric:tabular-nums}
table.t tr:last-child td{border-bottom:0}
table.t td.mono{color:var(--text);font-weight:500}

label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--text2);font-weight:500}
.toast{position:fixed;bottom:24px;left:50%;z-index:60;display:flex;align-items:center;gap:9px;padding:10px 16px;border-radius:9px;background:var(--text);color:#fff;box-shadow:0 16px 36px -12px rgba(0,0,0,.4);font-size:13px;font-weight:500;transform:translate(-50%,16px);opacity:0;transition:all .35s var(--ease);pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}
.hide{display:none!important}
@media print{aside.sb,.noprint{display:none!important}.app{display:block}body{background:#fff}.card{box-shadow:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="sb">
    <div class="brand"><div class="mark"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></div><div><b>Fuel</b><small>Bulk dashboard</small></div></div>
    <nav class="nav" id="nav"><div class="pill" id="pill"></div></nav>
    <button class="btn hide" id="installBtn" style="margin-top:auto;justify-content:center"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Install app</button>
    <div class="sb-foot" id="sbfoot"></div>
  </aside>
  <main id="view"></main>
</div>
<div class="modal" id="modal"><div class="card" id="modalBody"></div></div>
<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
// Offline support + install button (only works when served over http/https, e.g. GitHub Pages)
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js");
let deferredInstall = null;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferredInstall = e; document.getElementById("installBtn")?.classList.remove("hide"); });
window.addEventListener("appinstalled", () => document.getElementById("installBtn")?.classList.add("hide"));
document.addEventListener("click", async (e) => { if (!e.target.closest("#installBtn") || !deferredInstall) return; deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; document.getElementById("installBtn").classList.add("hide"); });
</script>
</body>
</html>
